name: Refresh Copilot Skills Feed

on:
  push:
    paths:
      - ".github/skills/**"
      - ".github/ai-toolkit/skills.json"
      - ".github/ai-toolkit/scripts/**"
      - ".github/workflows/copilot-skills-feed.yml"
  pull_request:
    paths:
      - ".github/skills/**"
      - ".github/ai-toolkit/skills.json"
      - ".github/ai-toolkit/scripts/**"
      - ".github/workflows/copilot-skills-feed.yml"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: copilot-skills-feed
  cancel-in-progress: false

jobs:
  validate-feed:
    name: Validate Skills Catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Generate skills feed
        run: python .github/ai-toolkit/scripts/generate_skills_feed.py

      - name: Verify generated catalog
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: git diff --exit-code -- .github/ai-toolkit/skills.json

      - name: Run feed tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest .github/ai-toolkit/scripts/tests -q

  refresh-feed:
    name: Refresh Skills Catalog
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate-feed
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Generate skills feed
        run: python .github/ai-toolkit/scripts/generate_skills_feed.py

      - name: Commit updated skills feed
        run: |
          if git diff --quiet -- .github/ai-toolkit/skills.json; then
            echo "Skills feed is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ai-toolkit/skills.json
          git commit -m "chore: refresh Copilot skills feed"
          git push
