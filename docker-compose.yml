# @format


services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pharmachain-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: pharmachain
      POSTGRES_USER: pharmachain
      POSTGRES_PASSWORD: pharmachain

    ports:
      # Host port 5439 avoids clashing with any native PostgreSQL install
      # already using 5432 on the host machine.
      - "5439:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    container_name: pharmachain-api

    depends_on:
      - db

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://pharmachain:pharmachain@db:5432/pharmachain

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: pharmachain-prometheus

    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

volumes:
  postgres_data:
  prometheus_data: